kind = "mobile"
previewPath = "/gaia-siap-mobile/"
title = "Gaia SIAP Mobile"
description = "Mobile companion app for Gaia SIAP workflow management. B2B users can monitor case status, browse their case list, drill into case details and workflow steps, and interact with AI assistance — all from their smartphone."
version = "1.0.0"
id = "artifacts/gaia-siap-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/gaia-siap-mobile/" ]
localPort = 22036

[services.development]
run = "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY pnpm --filter @workspace/gaia-siap-mobile run dev"

[services.production]
build = [ "sh", "-c", "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY pnpm --filter @workspace/gaia-siap-mobile run build" ]
run = [ "pnpm", "--filter", "@workspace/gaia-siap-mobile", "run", "serve" ]

[services.env]
PORT = "22036"
BASE_PATH = "/gaia-siap-mobile/"
